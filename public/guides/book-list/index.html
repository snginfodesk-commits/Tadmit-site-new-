<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 הספרים שכל משקיע נדל"ן חייב לקרוא — צמד ברזל</title>
<link rel="stylesheet" href="../_styles.css">
</head>
<body>
<main class="guide-page">
  <header class="guide-hero">
    <span class="badge">רשימת קריאה חינמית</span>
    <h1>10 הספרים שכל משקיע נדל"ן חייב לקרוא</h1>
    <p class="subtitle">התפתחות פיננסית, אישית ונדל"ן — הרשימה של צמד ברזל</p>
  </header>

  <section id="formState" class="guide-form-wrap">
    <form id="guideForm" novalidate>
      <label for="nameInput">שם מלא</label>
      <input id="nameInput" name="name" type="text" required placeholder="ישראלה ישראלית">

      <label for="emailInput">אימייל</label>
      <input id="emailInput" name="email" type="email" required placeholder="you@example.com">

      <label class="checkbox-label">
        <input id="termsCheckbox" type="checkbox">
        <span>אני מאשר/ת לקבל מיילים מצמד ברזל בנושא השקעות נדל"ן, הרצאות וקורסים. ניתן להסיר את ההרשמה בכל עת.</span>
      </label>
      <div id="checkboxError" class="error-msg" style="display:none">חובה לאשר כדי לקבל את הרשימה.</div>

      <button id="submitBtn" type="submit">שלחו לי את רשימת הספרים ←</button>
    </form>
  </section>

  <section id="successState" class="guide-success">
    <h2>✓ רשימת הספרים בדרך אליך</h2>
    <p>בדקו את תיבת המייל. אם היא לא הגיעה תוך 2-3 דקות — תבדקו גם בתיבת ספאם.</p>
  </section>
</main>

<script>
  window.GUIDE_CONFIG = {
    slug: 'book-list',
    title: 'רשימת ספרים מומלצים - התפתחות פיננסית, אישית ונדל"ן',
    pdfUrl: 'https://drive.google.com/file/d/1Ssph0bOK6QGSc8DCguVvVQ0OGnpZo4Rd/view'
  };
</script>
<script src="../_form.js"></script>
</body>
</html>
